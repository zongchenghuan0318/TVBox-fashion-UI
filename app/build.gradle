apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('release-signing.properties')
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }

task verifyReleaseSigning {
    doLast {
        if (!['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseSigning[it] }) {
            throw new GradleException('Release signing is missing. Configure release-signing.properties first.')
        }
        def store = java.security.KeyStore.getInstance(rootProject.file(releaseSigning.storeFile),
                releaseSigning.storePassword.toCharArray())
        def certificate = store.getCertificate(releaseSigning.keyAlias)
        def fingerprint = certificate == null ? '' : java.security.MessageDigest.getInstance('SHA-256')
                .digest(certificate.encoded).encodeHex().toString()
        if (fingerprint != '195cc65bd18f8e04184423ad84306a9ed9582f4f0be5cf7d26b19371e4bcba62') {
            throw new GradleException('Release certificate differs from the installed ZMovie certificate.')
        }
    }
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"
    // uiSupport.aar 的 HttpClientManager 依赖已被 Android 移除的 org.apache.http，
    // 播放页 onStop 上报播放结果时会抛 NoClassDefFoundError 导致闪退；声明系统可选库即可在运行时加载
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId 'com.studio.osc'
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 146
        versionName '1.1.36'
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ndk {
            abiFilters 'armeabi-v7a'
        }
        // Chaquopy Python 引擎（对齐 v6.1.7 的 Python 爬虫载荷）
        python {
            // host 构建用 Python 3.8（便携免安装版，仅存于 E 盘）
            buildPython "E:/code-tools/TraeREA/Python38/tools/python.exe"
            pip {
                install "requests==2.32.4"
                install "urllib3==2.2.3"
                install "certifi==2025.8.3"
                install "charset-normalizer==3.4.3"
                install "idna==3.10"
                install "beautifulsoup4==4.13.5"
                install "soupsieve==2.7"
                install "typing_extensions==4.13.2"
                install "lxml==4.6.3"
                install "chaquopy-libxml2==2.9.8"
                install "chaquopy-libxslt==1.1.32"
                install "pycryptodome==3.9.4"
                install "ujson==1.35"
                install "jsonpath==0.82.2"
                install "pyquery==2.0.1"
                install "cssselect==1.2.0"
                install "cachetools==5.5.2"
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    signingConfigs {
        release {
            if (releaseSigning['storeFile']) {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
    }

    // 编译产物统一命名为 Z影视.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Z影视.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    dexOptions {
        javaMaxHeapSize "4g"
        additionalParameters += '--multi-dex'
        additionalParameters += '--set-max-idx-number=48000'
        additionalParameters += '--minimal-main-dex'
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn verifyReleaseSigning
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    api fileTree(dir: "libs", include: ["*.jar"])
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation files('libs\\thunder.jar')

    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.squareup.okio:okio:2.6.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'

    implementation project(":player")
    implementation(name: 'uiSupport-release', ext: 'aar')

    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.github.getActivity:XXPermissions:13.6'

    implementation "com.github.bumptech.glide:glide:3.7.0"
    implementation 'com.liulishuo.filedownloader:library:1.7.7'//downloader
    implementation 'com.lzy.net:okgo:3.0.4'

    // QuickJS JS 引擎（对齐 v6.1.7 的 JS 爬虫，包名 com.whl.quickjs.wrapper）
    implementation 'wang.harlon.quickjs:wrapper-android:2.4.5'
}
