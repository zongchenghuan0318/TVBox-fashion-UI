<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>Z 影视 · 无线伴侣</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="ui.css">
</head>

<body>
	<!-- HUD 悬浮灵动胶囊通知 -->
	<div id="hudToast" class="hud-toast-wrap" role="alert">
		<div class="hud-toast-pill">
			<svg id="hudIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
				<polyline points="20 6 9 17 4 12"></polyline>
			</svg>
			<span id="hudMessage">已推送到电视</span>
		</div>
	</div>

	<!-- 主容器 -->
	<div class="app-container">
		<!-- 头部品牌栏 -->
		<header class="app-header">
			<div class="brand-row">
				<div class="brand-title-wrap">
					<div class="brand-icon">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<rect x="2" y="7" width="20" height="15" rx="3" ry="3"></rect>
							<polyline points="17 2 12 7 7 2"></polyline>
						</svg>
					</div>
					<h1 class="brand-title">Z 影视 · 远程控制</h1>
				</div>
				<div class="status-badge">
					<span class="status-dot"></span>
					<span>局域网已连接</span>
				</div>
			</div>
			<p class="app-subtitle">在手机或电脑端轻松实现搜索、大屏投送与配置同步</p>
		</header>

		<!-- 主内容面板区 -->
		<main id="mainPanels">
			<!-- 面板 1：远程搜索 -->
			<section id="panel1" class="glass-card">
				<div class="card-head">
					<h2 class="card-title">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="11" cy="11" r="8"></circle>
							<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
						</svg>
						电视遥控搜索
					</h2>
					<p class="card-desc">输入影片或拼音，指令直达电视大屏自动聚合检索</p>
				</div>
				<div class="input-action-row">
					<input id="search_key_word" class="glass-input" type="text" placeholder="输入电影、电视剧或演员姓名..." autocomplete="off" />
					<button onclick="search(); return false;" class="btn-primary">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="11" cy="11" r="8"></circle>
							<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
						</svg>
						搜索
					</button>
				</div>
			</section>

			<!-- 面板 2：视频直推 -->
			<section id="panel2" class="glass-card" style="display: none;">
				<div class="card-head">
					<h2 class="card-title">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<polygon points="5 3 19 12 5 21 5 3"></polygon>
						</svg>
						视频直推播放
					</h2>
					<p class="card-desc">支持输入或粘贴 m3u8、mp4、磁力链或网页流媒体直达电视解码</p>
				</div>
				<div class="input-action-row">
					<input id="push_url" class="glass-input" type="text" placeholder="粘贴视频播放地址或流媒体链接..." autocomplete="off" />
					<button onclick="push(); return false;" class="btn-primary">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
							<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
							<polyline points="16 6 12 2 8 6"></polyline>
							<line x1="12" y1="2" x2="12" y2="15"></line>
						</svg>
						推送
					</button>
				</div>
			</section>

			<!-- 面板 3：接口配置 & 本地存储 -->
			<section id="panel3" class="glass-card" style="display: none;">
				<div class="card-head">
					<h2 class="card-title">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="3"></circle>
							<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
						</svg>
						点播接口配置
					</h2>
					<p class="card-desc">远程设置电视端的数据订阅源地址，确认后即刻生效</p>
				</div>
				<div class="input-action-row">
					<input id="diy_api_url" class="glass-input" type="text" placeholder="输入自定义接口源地址 (URL)..." autocomplete="off" />
					<button onclick="api(); return false;" class="btn-primary">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
							<polyline points="20 6 9 17 4 12"></polyline>
						</svg>
						确定
					</button>
				</div>

				<div style="margin: 32px 0 16px 0; border-top: 1px solid var(--border-subtle); padding-top: 24px;">
					<div class="card-head">
						<h3 class="card-title">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
							</svg>
							电视本地存储
						</h3>
						<p class="card-desc">无线管理电视内置存储中的配置文件与多媒体包</p>
					</div>

					<input type="file" id="file_uploader" style="display:none;" onchange="uploadTip()" multiple />

					<div class="file-toolbar">
						<button class="btn-pill" onclick="uploadFile(); return false;">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
							上传文件
						</button>
						<button class="btn-pill" onclick="newFolder(); return false;">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
							新建文件夹
						</button>
						<button id="delCurFolder" class="btn-pill btn-pill-danger" onclick="delFolder(); return false;" style="display: none;">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
							删除当前文件夹
						</button>
					</div>

					<div id="file_list" class="file-list-container">
						<!-- 文件列表项由 JS 动态生成 -->
					</div>
				</div>
			</section>
		</main>

		<!-- 底部悬浮磨砂胶囊导航 -->
		<nav class="bottom-tabbar" role="tablist">
			<a id="tab1" class="tab-btn active" role="tab" onclick="showPanel(1); return false;">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="11" cy="11" r="8"></circle>
					<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
				</svg>
				<span>搜索</span>
			</a>
			<a id="tab2" class="tab-btn" role="tab" onclick="showPanel(2); return false;">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
					<polyline points="16 6 12 2 8 6"></polyline>
					<line x1="12" y1="2" x2="12" y2="15"></line>
				</svg>
				<span>推送</span>
			</a>
			<a id="tab3" class="tab-btn" role="tab" onclick="showPanel(3); return false;">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="12" cy="12" r="3"></circle>
					<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
				</svg>
				<span>配置</span>
			</a>
		</nav>
	</div>

	<!-- 模态弹窗 1：文件详情与接口应用 -->
	<div id="fileInfoDialog" class="modal-overlay">
		<div class="modal-sheet">
			<h3 class="modal-title">本地文件接口</h3>
			<p class="modal-caption">点击「使用」时将自动将对应路径填入电视配置栏</p>
			<div class="modal-field">
				<label class="modal-label">本机内部协议地址</label>
				<div class="input-action-row" style="margin-bottom: 12px;">
					<input id="fileUrl1" class="glass-input" type="text" readonly />
					<button onclick="fileToApi(1); return false;" class="btn-primary" style="min-width: 72px;">使用</button>
				</div>
			</div>
			<div class="modal-field">
				<label class="modal-label">局域网 HTTP 地址</label>
				<div class="input-action-row">
					<input id="fileUrl2" class="glass-input" type="text" readonly />
					<button onclick="fileToApi(2); return false;" class="btn-primary" style="min-width: 72px;">使用</button>
				</div>
			</div>
			<div class="modal-actions">
				<button id="delFileBtn" onclick="delFile(); return false;" class="btn-solid-danger">删除文件</button>
				<button onclick="hideFileInfo(); return false;" class="btn-ghost">关闭</button>
			</div>
		</div>
	</div>

	<!-- 模态弹窗 2：确认上传 -->
	<div id="uploadTip" class="modal-overlay">
		<div class="modal-sheet">
			<h3 class="modal-title">确认上传文件？</h3>
			<p id="uploadTipContent" class="modal-caption" style="word-break: break-all;"></p>
			<div class="modal-actions">
				<button onclick="doUpload(0); return false;" class="btn-ghost">取消</button>
				<button onclick="doUpload(1); return false;" class="btn-solid-primary">确认上传</button>
			</div>
		</div>
	</div>

	<!-- 模态弹窗 3：新建文件夹 -->
	<div id="newFolder" class="modal-overlay">
		<div class="modal-sheet">
			<h3 class="modal-title">新建文件夹</h3>
			<div class="modal-field">
				<input id="newFolderContent" class="glass-input" type="text" placeholder="输入文件夹名称..." />
			</div>
			<div class="modal-actions">
				<button onclick="doNewFolder(0); return false;" class="btn-ghost">取消</button>
				<button onclick="doNewFolder(1); return false;" class="btn-solid-primary">创建</button>
			</div>
		</div>
	</div>

	<!-- 模态弹窗 4：删除文件夹确认 -->
	<div id="delFolder" class="modal-overlay">
		<div class="modal-sheet">
			<h3 class="modal-title">删除文件夹</h3>
			<p id="delFolderContent" class="modal-caption"></p>
			<div class="modal-actions">
				<button onclick="doDelFolder(0); return false;" class="btn-ghost">取消</button>
				<button onclick="doDelFolder(1); return false;" class="btn-solid-danger">确认删除</button>
			</div>
		</div>
	</div>

	<!-- 模态弹窗 5：删除文件确认 -->
	<div id="delFile" class="modal-overlay">
		<div class="modal-sheet">
			<h3 class="modal-title">删除文件</h3>
			<p id="delFileContent" class="modal-caption"></p>
			<div class="modal-actions">
				<button onclick="doDelFile(0); return false;" class="btn-ghost">取消</button>
				<button onclick="doDelFile(1); return false;" class="btn-solid-danger">确认删除</button>
			</div>
		</div>
	</div>

	<!-- 模态加载指示器 -->
	<div id="loadingToast" class="modal-overlay" style="background: rgba(0,0,0,0.4);">
		<div style="background: rgba(18, 22, 31, 0.9); border: 1px solid var(--border-glow); padding: 18px 26px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: 12px; color: #ffffff;">
			<span class="spinner-ring"></span>
			<span style="font-size: 14px; font-weight: 500;">处理中...</span>
		</div>
	</div>

	<!-- 兼容性保留警告容器 -->
	<div id="warnToast" style="display:none;"><div id="warnToastContent"></div></div>

	<script src="jquery.js"></script>
	<script src="script.js"></script>
</body>

</html>
